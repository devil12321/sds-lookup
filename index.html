<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>危化品SDS速查 · 1800+化学品 | 含易制毒/易制爆/剧毒管制信息</title>
<script src="html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --line:#e6eaf0; --txt:#1c2430; --sub:#64748b;
  --pri:#0f62fe; --pri-soft:#e8f0fe; --warn:#d97706; --warn-soft:#fef3e2;
  --danger:#dc2626; --danger-soft:#fdecec; --ok:#059669; --ok-soft:#e6f5ef;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(135deg,#0b3fa8,#0f62fe 60%,#3b82f6);color:#fff;padding:22px 14px 20px;border-radius:0 0 22px 22px;box-shadow:0 4px 18px rgba(15,98,254,.25)}
header .wrap{padding-bottom:0}
h1{font-size:22px;font-weight:700;letter-spacing:.5px}
.hsub{font-size:12.5px;opacity:.85;margin-top:4px}
.searchbox{margin-top:14px;position:relative}
.searchbox input{width:100%;padding:13px 44px 13px 16px;border:none;border-radius:12px;font-size:16px;background:#fff;color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.12);outline:none}
.searchbox svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 14px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);cursor:pointer;white-space:nowrap}
.chip.on{background:#fff;color:var(--pri);font-weight:600}
.chip.ctl{background:rgba(200,30,30,.18);border-color:rgba(255,255,255,.5)}
.chip.ctl.on{background:#c81e1e;color:#fff;border-color:#fff}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 10px;font-size:13px;color:var(--sub)}
.dl-all{border:none;background:var(--pri-soft);color:var(--pri);padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;transition:box-shadow .15s}
.item:active{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.item .nm{font-size:16.5px;font-weight:600}
.item .meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.badges{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:0 0 auto}
.badge{font-size:11px;padding:2.5px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.b-cat{background:var(--pri-soft);color:var(--pri)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-gray{background:#eef1f5;color:var(--sub)}
.b-jd{background:var(--danger-soft);color:var(--danger);border:1px solid #f5c2c2}
.b-yb{background:var(--warn-soft);color:var(--warn)}
.b-yd{background:#f3e8ff;color:#7c3aed}
.more{border:none;background:#fff;border:1px solid var(--line);color:var(--pri);padding:10px;width:100%;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
.empty{text-align:center;color:var(--sub);padding:50px 0;font-size:14px}
/* detail */
#detail{display:none}
.back{border:none;background:#fff;border:1px solid var(--line);color:var(--pri);padding:9px 18px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;margin:16px 0 10px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.dhead{background:linear-gradient(135deg,#0b3fa8,#0f62fe);color:#fff;padding:18px 16px}
.dhead h2{font-size:21px}
.dhead .den{font-size:13px;opacity:.85;margin-top:2px}
.dhead .dm{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dhead .badge{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}
.pictos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.picto{font-size:11.5px;background:var(--warn-soft);color:var(--warn);border:1px solid #f6d8ab;padding:3px 10px;border-radius:999px;font-weight:600}
.dlbar{position:sticky;top:0;z-index:9;background:rgba(245,247,250,.92);backdrop-filter:blur(6px);padding:10px 0;margin-bottom:4px;display:flex;gap:9px}
.dlbtn{flex:1;border:none;background:var(--pri);color:#fff;padding:12px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(15,98,254,.3)}
.dlbtn:disabled{opacity:.55}
.dlbtn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--pri);box-shadow:none;flex:0 0 auto;padding:12px 16px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.sec h3{font-size:15px;padding:11px 15px;background:#f0f4f9;border-bottom:1px solid var(--line);color:#0b3fa8}
.sec table{width:100%;border-collapse:collapse;font-size:13.5px}
.sec td{padding:9px 15px;border-top:1px solid var(--line);vertical-align:top}
.sec td.k{width:96px;color:var(--sub);font-weight:600;white-space:nowrap;background:#fafbfd}
.notice{background:var(--warn-soft);border:1px solid #f3dcb2;color:#8a5a12;font-size:12px;border-radius:12px;padding:10px 13px;margin:14px 0;line-height:1.7}
.srcnote{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.7}
.spin{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:7px}
@keyframes s{to{transform:rotate(360deg)}}
@media print{.dlbar,.back,header .hsub,.notice{display:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>🧪 危化品 SDS 速查</h1>
  <div class="hsub" id="hsub">正在加载卡片数据…</div>
  <div class="searchbox">
    <input id="q" type="search" placeholder="搜索：名称 / 别名 / 英文名 / CAS号 / UN号" autocomplete="off">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </div>
</div></header>

<div class="wrap">
  <!-- 列表视图 -->
  <div id="listview">
    <div class="chips" id="chips"></div>
    <div class="toolbar">
      <span id="cnt"></span>
      <button class="dl-all" id="dlAll">⬇ 导出筛选结果 PDF</button>
    </div>
    <div class="list" id="list"></div>
    <button class="more" id="more" style="display:none">加载更多</button>
  </div>

  <!-- 详情视图 -->
  <div id="detail">
    <button class="back" onclick="showList()">← 返回列表</button>
    <div class="dlbar">
      <button class="dlbtn" id="dlPdf">⬇ 下载本卡完整 PDF</button>
      <button class="dlbtn ghost" onclick="window.print()">🖨 打印</button>
    </div>
    <div id="dbody"></div>
    <div class="notice">⚠️ 本资料基于 ILO/WHO 国际化学品安全卡（ICSC，中文版：中国石化北京化工研究院）、中文扩展 SDS 及公开权威资料整理；管制信息依据《危险化学品目录（2015版）》（剧毒）、《易制爆危险化学品名录（2017年版）》、《易制毒化学品管理条例》附表（2025整理版）。仅供安全管理参考。实际作业请以供应商提供的正式 SDS 和国家法规为准。</div>
  </div>
</div>

<script>
let DATA=null, cards=[], shown=[], PAGE=0, CAT="全部", CTRL="", CUR=null;
const PER=60;
const CATCOLOR={"易燃液体":"b-danger","易燃气体":"b-danger","腐蚀品":"b-warn","氧化剂":"b-warn","毒害品":"b-danger","遇湿易燃品":"b-danger","气体":"b-ok","其他":"b-gray"};
function ctlCls(l){return l.startsWith("剧毒")?"b-jd":l.startsWith("易制爆")?"b-yb":"b-yd"}

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

async function init(){
  const r=await fetch("cards.json"); const j=await r.json();
  DATA=j; cards=j.cards;
  document.getElementById("hsub").textContent=`${j.count} 种化学品 · ICSC国际化学品安全卡 + 中文扩展SDS（更新于 ${j.updated}）`;
  buildChips(); applyFilter();
  const m=location.hash.match(/#\/c\/(.+)/);
  if(m){const c=cards.find(x=>x.id===m[1]); if(c) showDetail(c);}
}
function buildChips(){
  const el=document.getElementById("chips");
  const counts={}; cards.forEach(c=>counts[c.cat]=(counts[c.cat]||0)+1);
  const cats=["全部",...DATA.cats.filter(c=>counts[c])];
  let html=cats.map(c=>`<button class="chip${c===CAT&&!CTRL?" on":""}" data-c="${c}">${c}${c!=="全部"?` ${counts[c]}`:" "+cards.length}</button>`).join("");
  const ctlCounts={"易制毒":0,"易制爆":0,"剧毒":0};
  cards.forEach(c=>(c.ctrl||[]).forEach(l=>{
    if(l.startsWith("易制毒"))ctlCounts["易制毒"]++;
    else if(l.startsWith("易制爆"))ctlCounts["易制爆"]++;
    else if(l.startsWith("剧毒"))ctlCounts["剧毒"]++;
  }));
  html+=`<button class="chip ctl${CTRL?" on":""}" data-t="__all">⚠ 管制品 ${ctlCounts["易制毒"]+ctlCounts["易制爆"]+ctlCounts["剧毒"]}</button>`;
  for(const k of ["易制毒","易制爆","剧毒"])
    html+=`<button class="chip ctl${CTRL===k?" on":""}" data-t="${k}">${k} ${ctlCounts[k]}</button>`;
  el.innerHTML=html;
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    if(b.dataset.t){CTRL=CTRL===b.dataset.t?"":b.dataset.t;}
    else{CAT=b.dataset.c;CTRL="";}
    buildChips();applyFilter();window.scrollTo(0,0);
  });
}
function applyFilter(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  shown=cards.filter(c=>(CAT==="全部"||c.cat===CAT)&&(CTRL?(c.ctrl||[]).some(l=>l.startsWith(CTRL)):true)&&(!q||c.search.includes(q)));
  PAGE=0; renderList();
}
function renderList(){
  const n=Math.min((PAGE+1)*PER,shown.length);
  const el=document.getElementById("list");
  el.innerHTML=shown.slice(0,n).map(c=>`
    <div class="item" onclick="goto('${c.id}')">
      <div><div class="nm">${esc(c.name)}</div>
        <div class="meta">${esc(c.en||c.alias||"")} · CAS ${esc(c.cas||"—")}${c.un?" · UN "+esc(c.un):""}${c.icsc?" · ICSC "+c.icsc:""}</div></div>
      <div class="badges">
        ${(c.ctrl||[]).slice(0,2).map(l=>`<span class="badge ${ctlCls(l)}">⚠ ${esc(l.replace("·","·"))}</span>`).join("")}
        <span class="badge ${CATCOLOR[c.cat]||"b-gray"}">${esc(c.cat)}</span>
        ${c.signal?`<span class="badge ${c.signal==="危险"?"b-danger":"b-warn"}">${c.signal}</span>`:""}
      </div>
    </div>`).join("")+(shown.length? "":`<div class="empty">未找到匹配的化学品，换个关键词试试</div>`);
  document.getElementById("cnt").textContent=`共 ${shown.length} 条结果`;
  const mb=document.getElementById("more");
  mb.style.display=n<shown.length?"block":"none";
  mb.textContent=`加载更多（已显示 ${n} / ${shown.length}）`;
}
document.getElementById("more").onclick=()=>{PAGE++;renderList()};
let tmr; document.getElementById("q").addEventListener("input",e=>{clearTimeout(tmr);tmr=setTimeout(applyFilter,180)});

function goto(id){location.hash="#/c/"+id;const c=cards.find(x=>x.id===id);if(c)showDetail(c);else alert("未找到该卡片")}
function showList(){location.hash="";document.getElementById("detail").style.display="none";document.getElementById("listview").style.display="block";window.scrollTo(0,0)}
function showDetail(c){
  CUR=c;
  document.getElementById("listview").style.display="none";
  const d=document.getElementById("detail"); d.style.display="block";
  let h=`<div class="dcard"><div class="dhead">
    <h2>${esc(c.name)}</h2><div class="den">${esc(c.en||"")}</div>
    <div class="dm">
      ${c.cas?`<span class="badge">CAS ${esc(c.cas)}</span>`:""}
      ${c.un?`<span class="badge">UN ${esc(c.un)}</span>`:""}
      ${c.icsc?`<span class="badge">ICSC ${esc(c.icsc)}</span>`:""}
      <span class="badge">${esc(c.cat)}</span>
      ${c.signal?`<span class="badge">${c.signal==="危险"?"⚠ 危险":"△ 警告"}</span>`:""}
      ${(c.ctrl||[]).map(l=>`<span class="badge" style="background:${l.startsWith("剧毒")?"#fdecec":l.startsWith("易制爆")?"#fdf3e3":"#f3e8ff"};color:${l.startsWith("剧毒")?"#c81e1e":l.startsWith("易制爆")?"#b45309":"#7c3aed"};border-color:transparent">⚠ ${esc(l)}</span>`).join("")}
    </div>
    ${c.pictos&&c.pictos.length?`<div class="pictos">${c.pictos.map(p=>`<span class="picto">◆ ${esc(p)}</span>`).join("")}</div>`:""}
  </div></div>`;
  h+=`<div id="pdfbody">`;
  h+=c.secs.map(s=>`<div class="sec"><h3>${esc(s.t)}</h3><table>${
    s.rows.map(r=>r[0]&&r[0].length<30
      ?`<tr><td class="k">${esc(r[0])}</td><td>${esc(r[1]).replace(/\n/g,"<br>")}</td></tr>`
      :`<tr><td colspan="2">${esc(r[0]?r[0]+"：":"")+esc(r[1]).replace(/\n/g,"<br>")}</td></tr>`).join("")
  }</table></div>`).join("");
  h+=`</div>`;
  h+=`<div class="srcnote">数据来源：${esc(c.sources.join("；"))} · 危化品SDS速查</div>`;
  document.getElementById("dbody").innerHTML=h;
  window.scrollTo(0,0);
}

/* ---------- PDF ---------- */
async function exportPdf(nodes, filename, btn){
  const old=btn.innerHTML; btn.disabled=true;
  btn.innerHTML=`<span class="spin"></span>正在生成 PDF…`;
  try{
    const box=document.createElement("div");
    box.style.cssText="position:fixed;left:-10000px;top:0;width:760px;background:#fff;padding:24px;font-family:'Microsoft YaHei',sans-serif;color:#1c2430;font-size:13px;line-height:1.65";
    box.innerHTML=nodes;
    document.body.appendChild(box);
    await html2pdf().set({
      margin:[8,6,8,6], filename,
      image:{type:"jpeg",quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css","legacy"],avoid:["tr",".sec"]}
    }).from(box).save();
    box.remove();
  }catch(e){alert("PDF 生成失败："+e.message)}
  btn.disabled=false; btn.innerHTML=old;
}
function cardHtml(c,compact){
  let h=`<div style="page-break-after:always${compact?"":";margin-bottom:10px"}">
  <div style="background:#0b3fa8;color:#fff;padding:12px 16px;border-radius:8px 8px 0 0">
    <div style="font-size:18px;font-weight:700">${esc(c.name)}${c.en?` <span style="font-size:12px;opacity:.85;font-weight:400">${esc(c.en)}</span>`:""}</div>
    <div style="font-size:11.5px;margin-top:3px">${[c.cas?"CAS "+c.cas:"",c.un?"UN "+c.un:"",c.icsc?"ICSC "+c.icsc:"",c.cat,c.signal,(c.ctrl||[]).length?("⚠ 管制："+c.ctrl.join("；")):""].filter(Boolean).join("　|　")}</div>
  </div>
  <div style="border:1px solid #dfe5ec;border-top:none;border-radius:0 0 8px 8px;padding:6px 0">`;
  h+=c.secs.map(s=>`<div style="padding:8px 16px 4px">
    <div style="font-weight:700;color:#0b3fa8;font-size:13.5px;border-bottom:1px solid #e6eaf0;padding-bottom:3px;margin-bottom:4px">${esc(s.t)}</div>
    ${s.rows.map(r=>`<div style="margin:2px 0"><span style="color:#64748b;font-weight:600">${esc(r[0]?r[0]+"：":"")}</span>${esc(r[1])}</div>`).join("")}
  </div>`).join("");
  h+=`</div><div style="font-size:10px;color:#94a3b8;text-align:right;margin-top:4px">来源：${esc(c.sources.join("；"))} · 危化品SDS速查</div></div>`;
  return h;
}
document.getElementById("dlPdf").onclick=function(){
  if(!CUR)return;
  exportPdf(cardHtml(CUR),`SDS-${CUR.name}-${CUR.cas||CUR.icsc||""}.pdf`,this);
};
document.getElementById("dlAll").onclick=function(){
  const t=shown.slice(0,80);
  if(!t.length)return alert("当前筛选结果为空");
  if(!confirm(`将把当前筛选结果的前 ${t.length} 张卡片生成为一个 PDF（数量过多可能导致生成缓慢）。是否继续？`))return;
  exportPdf(t.map(c=>cardHtml(c,true)).join(""),`SDS合集-${CAT==="全部"?"全部":CAT}-${t.length}张.pdf`,this);
};
init();
</script>
</body>
</html>
